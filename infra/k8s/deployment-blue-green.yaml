apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruralai-api-blue
  labels:
    app: ruralai-api
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ruralai-api
      color: blue
  template:
    metadata:
      labels:
        app: ruralai-api
        color: blue
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/ruralai-learning-engine:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ruralai-secrets
                  key: redis-url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruralai-api-green
  labels:
    app: ruralai-api
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ruralai-api
      color: green
  template:
    metadata:
      labels:
        app: ruralai-api
        color: green
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/ruralai-learning-engine:next
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
